<!DOCTYPE html>

    <style>

            margin: 0;

            border: none;

        .add-btn {

        .refresh-btn {
            background: #222;
            color: white;
        }

        .search-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;

            border-radius: 8px;

        .action-btn {

        }

        .delete-btn {
            width: 100%;
            margin-top: 8px;

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;

        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 900px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;

        .close-btn {

</head>

<body>

<header>
    <h1>📚 Weekly Tuition Reports</h1>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Saved Reports</h2>

        <div class="buttons">
            <button class="refresh-btn" onclick="loadReports()">
                🔄 Refresh
            </button>

            <button class="add-btn" onclick="goToAddReport()">
                ➕ Add Report
            </button>
        </div>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search student, parent, class or date..."
            oninput="filterReports()"
        >
    </div>

    <div class="status" id="status">
        Loading reports...
    </div>

    <div id="errorBox"></div>

    <div id="reportsContainer">
        <div class="loading">
            Loading saved reports...
        </div>
    </div>

</div>


<!-- FULL REPORT MODAL -->

<div class="modal" id="reportModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Report Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ✕ Close
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>


<script>

const API_BASE = "http://127.0.0.1:8000";

const REPORTS_API =
    API_BASE + "/api/reports/list/";

let allReports = [];


/* =========================================
   LOAD REPORTS
========================================= */

async function loadReports() {

    const container =
        document.getElementById("reportsContainer");

    const status =
        document.getElementById("status");

    const errorBox =
        document.getElementById("errorBox");

    container.innerHTML =
        `<div class="loading">
            Loading saved reports...
        </div>`;

    errorBox.innerHTML = "";

    status.textContent =
        "Connecting to Django API...";

    try {

        const response =
            await fetch(REPORTS_API);

        const text =
            await response.text();

        console.log("API response:", text);

        let data;

        try {

            data = JSON.parse(text);

        } catch (error) {

            throw new Error(
                "Backend returned HTML instead of JSON. Check Django API URL."
            );
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load reports"
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "API returned unsuccessful response"
            );

        }


        allReports =
            Array.isArray(data.reports)
                ? data.reports
                : [];


        status.textContent =
            `Total Reports: ${allReports.length}`;


        displayReports(allReports);


    } catch (error) {

        console.error(error);

        status.textContent =
            "Unable to load reports";

        errorBox.innerHTML =
            `<div class="error">
                ❌ ${escapeHtml(error.message)}
            </div>`;

        container.innerHTML = "";

    }

}


/* =========================================
   DISPLAY REPORTS
========================================= */

function displayReports(reports) {

    const container =
        document.getElementById("reportsContainer");


    if (!reports || reports.length === 0) {

        container.innerHTML =
            `<div class="empty">

                <h2>No Reports Found</h2>

                <p>
                    No saved tuition reports are available.
                </p>

                <button
                    class="add-btn"
                    onclick="goToAddReport()"
                    style="margin-top:15px;"
                >
                    Add First Report
                </button>

            </div>`;

        return;
    }


    container.innerHTML =
        `<div class="reports-grid">

            ${reports.map(
                reportCard
            ).join("")}

        </div>`;
}


/* =========================================
   REPORT CARD
========================================= */

function reportCard(report) {

    const student =
        report.student || {};


    const subjects =
        Array.isArray(report.subjects)
            ? report.subjects
            : [];


    const tests =
        Array.isArray(report.tests)
            ? report.tests
            : [];


    return `

        <div class="report-card">

            <div class="student-header">

                <h3>
                    ${escapeHtml(
                        student.name || "Unknown Student"
                    )}
                </h3>

                <div class="date">
                    ${escapeHtml(
                        report.date || ""
                    )}
                    ${report.day
                        ? " • " +
                          escapeHtml(report.day)
                        : ""}
                </div>

            </div>


            <div class="info-row">

                <span class="label">
                    Class
                </span>

                <span class="value">
                    ${escapeHtml(
                        student.student_class || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Parent
                </span>

                <span class="value">
                    ${escapeHtml(
                        student.parent_name || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Contact
                </span>

                <span class="value">
                    ${escapeHtml(
                        student.contact_no || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Session
                </span>

                <span class="value">
                    ${escapeHtml(
                        report.session_time || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Duration
                </span>

                <span class="value">
                    ${escapeHtml(
                        report.duration || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Tutor
                </span>

                <span class="value">
                    ${escapeHtml(
                        report.tutor_name || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Attendance
                </span>

                <span class="value">
                    ${escapeHtml(
                        report.attendance || "-"
                    )}
                </span>

            </div>


            <div class="info-row">

                <span class="label">
                    Punctuality
                </span>

                <span class="value">
                    ${escapeHtml(
                        report.punctuality || "-"
                    )}
                </span>

            </div>


            ${
                subjects.length
                ?
                `<div class="section">

                    <h4>Subjects</h4>

                    ${subjects.map(subject => `

                        <div class="subject">

                            <strong>
                                ${escapeHtml(
                                    subject.subject || "-"
                                )}
                            </strong>

                            <br>

                            Topics:
                            ${escapeHtml(
                                subject.topics_covered || "-"
                            )}

                            <br>

                            Completed:
                            ${escapeHtml(
                                subject.completed || "-"
                            )}

                        </div>

                    `).join("")}

                </div>`
                : ""
            }


            ${
                tests.length
                ?
                `<div class="section">

                    <h4>Test Results</h4>

                    ${tests.map(test => `

                        <div class="test">

                            <strong>
                                ${escapeHtml(
                                    test.subject || "-"
                                )}
                            </strong>

                            <br>

                            Marks:
                            ${escapeHtml(
                                String(
                                    test.marks_obtained ?? "-"
                                )
                            )}
                            /
                            ${escapeHtml(
                                String(
                                    test.total_marks ?? "-"
                                )
                            )}

                            <br>

                            Percentage:
                            ${escapeHtml(
                                String(
                                    test.percentage ?? "-"
                                )
                            )}%

                            <br>

                            Grade:
                            ${escapeHtml(
                                test.grade || "-"
                            )}

                        </div>

                    `).join("")}

                </div>`
                : ""
            }


            <button
                class="action-btn"
                onclick="viewReport(${report.id})"
            >
                👁 View Full Report
            </button>

        </div>
    `;
}


/* =========================================
   VIEW FULL REPORT
========================================= */

function viewReport(id) {

    const report =
        allReports.find(
            r => Number(r.id) === Number(id)
        );


    if (!report) {

        alert("Report not found.");

        return;
    }


    const student =
        report.student || {};


    document.getElementById("modalTitle")
        .textContent =
            `${student.name || "Student"} - Weekly Report`;


    document.getElementById("modalBody")
        .innerHTML = `

            <div class="detail-section">

                <h3>Student Information</h3>

                <div class="detail-text">

Student Name:
${escapeHtml(student.name || "-")}

Class:
${escapeHtml(student.student_class || "-")}

Parent Name:
${escapeHtml(student.parent_name || "-")}

Contact:
${escapeHtml(student.contact_no || "-")}

Date:
${escapeHtml(report.date || "-")}

Day:
${escapeHtml(report.day || "-")}

                </div>

            </div>


            <div class="detail-section">

                <h3>Session Information</h3>

                <div class="detail-text">

Session Time:
${escapeHtml(report.session_time || "-")}

Duration:
${escapeHtml(report.duration || "-")}

Tutor:
${escapeHtml(report.tutor_name || "-")}

Class Type:
${escapeHtml(report.class_type || "-")}

Arrival:
${escapeHtml(report.arrival || "-")}

Departure:
${escapeHtml(report.departure || "-")}

Attendance:
${escapeHtml(report.attendance || "-")}

Punctuality:
${escapeHtml(report.punctuality || "-")}

                </div>

            </div>


            <div class="detail-section">

                <h3>Subjects</h3>

                <div class="detail-text">

                    ${formatSubjects(report.subjects)}

                </div>

            </div>


            <div class="detail-section">

                <h3>Test Results</h3>

                <div class="detail-text">

                    ${formatTests(report.tests)}

                </div>

            </div>


            <div class="detail-section">

                <h3>Achievements</h3>

                <div class="detail-text">
                    ${escapeHtml(
                        report.achievements || "-"
                    )}
                </div>

            </div>


            <div class="detail-section">

                <h3>Next Class Goals</h3>

                <div class="detail-text">
                    ${escapeHtml(
                        report.next_class_goals || "-"
                    )}
                </div>

            </div>


            <div class="detail-section">

                <h3>Teacher Remarks</h3>

                <div class="detail-text">
                    ${escapeHtml(
                        report.teacher_remarks || "-"
                    )}
                </div>

            </div>


            <div class="detail-section">

                <h3>Parent Feedback</h3>

                <div class="detail-text">
                    ${escapeHtml(
                        report.parent_feedback || "-"
                    )}
                </div>

            </div>

        `;


    document.getElementById("reportModal")
        .style.display = "block";
}


/* =========================================
   FORMAT SUBJECTS
========================================= */

function formatSubjects(subjects) {

    if (!Array.isArray(subjects) ||
        subjects.length === 0) {

        return "No subject records.";
    }


    return subjects.map(subject => `

        <p style="margin-bottom:12px;">

            <strong>
                ${escapeHtml(
                    subject.subject || "-"
                )}
            </strong>

            <br>

            Topics:
            ${escapeHtml(
                subject.topics_covered || "-"
            )}

            <br>

            Completed:
            ${escapeHtml(
                subject.completed || "-"
            )}

        </p>

    `).join("");
}


/* =========================================
   FORMAT TESTS
========================================= */

function formatTests(tests) {

    if (!Array.isArray(tests) ||
        tests.length === 0) {

        return "No test records.";
    }


    return tests.map(test => `

        <p style="margin-bottom:12px;">

            <strong>
                ${escapeHtml(
                    test.subject || "-"
                )}
            </strong>

            <br>

            Marks:
            ${escapeHtml(
                String(
                    test.marks_obtained ?? "-"
                )
            )}
            /
            ${escapeHtml(
                String(
                    test.total_marks ?? "-"
                )
            )}

            <br>

            Percentage:
            ${escapeHtml(
                String(
                    test.percentage ?? "-"
                )
            )}%

            <br>

            Grade:
            ${escapeHtml(
                test.grade || "-"
            )}

        </p>

    `).join("");
}


/* =========================================
   SEARCH
========================================= */

function filterReports() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    if (!search) {

        displayReports(allReports);

        return;
    }


    const filtered =
        allReports.filter(report => {

            const student =
                report.student || {};


            const text = [

                student.name,
                student.student_class,
                student.parent_name,
                student.contact_no,

                report.date,
                report.day,
                report.tutor_name,
                report.class_type,

                report.achievements,
                report.next_class_goals,
                report.teacher_remarks,
                report.parent_feedback

            ]
            .join(" ")
            .toLowerCase();


            return text.includes(search);

        });


    displayReports(filtered);
}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal() {

    document.getElementById("reportModal")
        .style.display = "none";
}


window.onclick = function(event) {

    const modal =
        document.getElementById("reportModal");

    if (event.target === modal) {

        closeModal();

    }

};


/* =========================================
   NAVIGATION
========================================= */

function goToAddReport() {

    window.location.href = "ex.html";

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   START
========================================= */

loadReports();

</script>

</body>
</html>
